[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcrisk"
version = "0.1.0"
description = "A validated PD scorecard and LightGBM challenger on Lending Club loans, with expected loss and stress"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jursta", email = "aobo443@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.3,!=4.7.0",  # 4.7.0 Windows wheel crashes setting labels (null pointer)
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
report = ["markdown>=3.6"]

[project.scripts]
lcrisk = "lcrisk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lcrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
